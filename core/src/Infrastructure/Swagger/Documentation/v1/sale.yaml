openapi: 3.0.0
info:
  title: Sale API
  description: Sale API
  version: 1.0.0

paths:
  /sales:
    get:
      summary: Get all sales
      description: 'Get a list of sales with optional filters and pagination'
      tags: [ Sale ]
      operationId: v1ListSales
      parameters:
        - name: customer
          description: Filter by customer name
          in: query
          schema:
            type: string
            minLength: 3
            maxLength: 255
        - name: fromDate
          description: Filter by date (Greater than or equal)
          in: query
          examples:
            ShortDate:
              value: "2025-01-01"
              summary: Short date string format
            DateTime:
              value: "2025-01-01T00:00:00+01:00"
              summary: Date string format
          schema:
            oneOf:
              - type: string
                format: date
              - type: string
                format: date-time
        - name: toDate
          description: Filter by date (Less than or equal)
          in: query
          examples:
            ShortDate:
              value: "2025-01-01"
              summary: Short date string format
            DateTime:
              value: "2025-01-01T00:00:00+01:00"
              summary: Date string format
          schema:
            oneOf:
              - type: string
                format: date
              - type: string
                format: date-time
        - name: number
          description: Filter by number
          in: query
          schema:
            type: string
            minLength: 3
            maxLength: 255
        - name: createdBy
          description: Filter by created user
          in: query
          schema:
            type: string
            minLength: 3
            maxLength: 255
        - name: fromCreatedAt
          description: Filter by created date (Greater than or equal)
          in: query
          examples:
            ShortDate:
              value: "2025-01-01"
              summary: Short date string format
            DateTime:
              value: "2025-01-01T00:00:00+01:00"
              summary: Date string format
          schema:
            oneOf:
              - type: string
                format: date
              - type: string
                format: date-time
        - name: toCreatedAt
          description: Filter by created date (Less than or equal)
          in: query
          examples:
            ShortDate:
              value: "2025-01-01"
              summary: Short date string format
            DateTime:
              value: "2025-01-01T00:00:00+01:00"
              summary: Date string format
          schema:
            oneOf:
              - type: string
                format: date
              - type: string
                format: date-time
        - name: page
          description: Set page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          description: Limit rows per page
          in: query
          schema:
            type: integer
            minimum: 5
            maximum: 100
            default: 10
        - name: sort
          description: Sort list by fields
          in: query
          examples:
            SortDesc:
              value: "-createdAt"
              summary: Sort desc
            Multiple:
              value: "-createdAt,+name"
              summary: Multiple
          schema:
            type: string
      responses:
        '200':
          description: 'List of Authors'
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SaleList'
                  pagination:
                    $ref: '#/components/schemas/PaginationView'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/JWTNotFound'
        '404':
          $ref: '#/components/responses/ObjectNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    post:
      summary: Create a new sale
      description: 'Create a new sale with the provided data'
      tags: [ Sale ]
      operationId: v1CreateSale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalePayload'
      responses:
        '201':
          description: 'Sale created successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SaleList'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/JWTNotFound'
        '404':
          $ref: '#/components/responses/ObjectNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /sales/{saleId}:
    get:
      summary: Get a sale by ID
      description: 'Retrieve a sale by its unique ID'
      tags: [ Sale ]
      operationId: v1GetSaleById
      parameters:
        - name: saleId
          description: The unique ID of the sale
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'Sale retrieved successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Sale'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/JWTNotFound'
        '404':
          $ref: '#/components/responses/ObjectNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  schemas:
    Sale:
      type: object
      properties:
        id:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
        customer:
          $ref: '#/components/schemas/SaleCustomer'
        number:
          type: string
          example: F-12345
        invoice:
          $ref: '#/components/schemas/SaleInvoice'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/SaleLine'
        createdBy:
          type: string
          example: admin
        createdAt:
          type: string
          format: date-time
          example: 2023-06-01T12:00:00Z
        updatedBy:
          type: string
          example: admin
        updatedAt:
          type: string
          format: date-time
          example: 2023-06-01T12:00:00Z

    SaleList:
      type: object
      properties:
        id:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
        customer:
          $ref: '#/components/schemas/SaleCustomer'
        number:
          type: string
          example: F-12345
        invoice:
          $ref: '#/components/schemas/SaleInvoice'
        createdBy:
          type: string
          example: admin
        createdAt:
          type: string
          format: date-time
          example: 2023-06-01T12:00:00Z
        updatedBy:
          type: string
          example: admin
        updatedAt:
          type: string
          format: date-time
          example: 2023-06-01T12:00:00Z

    SalePayload:
      type: object
      required:
        - customerId
        - invoice
        - lines
      properties:
        customerId:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
        invoice:
          $ref: '#/components/schemas/SaleInvoice'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/SaleLinePayload'

    SaleCustomer:
      type: object
      properties:
        id:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
        name:
          type: string
          example: John
        surname:
          type: string
          example: Doe
        vatNumber:
          type: string
          example: 1234567890
        number:
          type: string
          example: SN12546

    SaleInvoice:
      type: object
      properties:
        date:
          type: string
          format: date
          example: 2023-06-01
        amount:
          type: number
          format: float
          example: 100.50
        taxPercentage:
          type: number
          format: float
          example: 18.0
        taxes:
          type: number
          format: float
          example: 18.09
        total:
          type: number
          format: float
          example: 118.59

    SaleLine:
      type: object
      properties:
        lineId:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
        book:
          type: object
          properties:
            id:
              type: string
              example: 123e4567-e89b-12d3-a456-426614174000
              format: uuid
            title:
              type: string
              example: The Great Gatsby
            isbn:
              type: string
              example: 978-3161484100
        quantity:
          type: integer
          example: 2
        price:
          type: number
          format: float
          example: 50.25
        discount:
          type: number
          format: float
          example: 5.00
        total:
          type: number
          format: float
          example: 95.50

    SaleLinePayload:
      type: object
      required:
        - bookId
        - quantity
        - price
        - discount
        - total
      properties:
        bookId:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
        quantity:
          type: integer
          example: 2
        price:
          type: number
          format: float
          example: 50.25
        discount:
          type: number
          format: float
          example: 5.00
        total:
          type: number
          format: float
          example: 95.50

    PaginationView:
      type: object
      properties:
        total:
          type: integer
          example: 2
        rowsPerPage:
          type: integer
          example: 10
        page:
          type: integer
          example: 1
        totalPages:
          type: integer
          example: 5

  responses:
    Success:
      description: Success
      content:
        application/json:
          schema:
            properties:
              data:
                type: array
                items:
                  type: string
                example: [ ]

    JWTNotFound:
      description: JWT not Found
      content:
        application/json:
          schema:
            properties:
              message:
                type: string
                example: JWT not Found
              code:
                type: integer
                example: 401

    ObjectNotFound:
      description: Object not Found
      content:
        application/json:
          schema:
            properties:
              message:
                type: string
                example: Object not found
              code:
                type: integer
                example: 404

    BadRequestError:
      description: Bad Request Error
      content:
        application/json:
          schema:
            properties:
              message:
                type: string
                example: Bad Request Error
              code:
                type: integer
                example: 400

    ServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            properties:
              message:
                type: string
                example: Internal Server Error
              code:
                type: integer
                example: 500

    ServiceUnavailable:
      description: Server Unavailable
      content:
        application/json:
          schema:
            properties:
              message:
                type: string
                example: Server Unavailable
              code:
                type: integer
                example: 503
