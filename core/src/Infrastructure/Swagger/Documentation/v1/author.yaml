openapi: 3.0.0
info:
  title: Author API
  description: Author API
  version: 1.0.0

paths:
  /authors:
    get:
      summary: 'List Authors'
      description: 'Get a list of authors with optional filters and pagination.'
      tags: [ Authors ]
      operationId: v1ListAuthors
      parameters:
        - name: name
          description: Filter by name
          in: query
          schema:
            type: string
            minLength: 3
            maxLength: 255
        - name: realName
          description: Filter by real name
          in: query
          schema:
            type: string
            minLength: 3
            maxLength: 255
        - name: nationality
          description: Filter by nationality
          in: query
          schema:
            type: string
            minLength: 3
            maxLength: 255
        - name: createdBy
          description: Filter by created user
          in: query
          schema:
            type: string
            minLength: 3
            maxLength: 255
        - name: fromCreatedAt
          description: Filter by created date (Greater than or equal)
          in: query
          examples:
            ShortDate:
              value: "2025-01-01"
              summary: Short date string format
            DateTime:
              value: "2025-01-01T00:00:00+01:00"
              summary: Date string format
          schema:
            oneOf:
              - type: string
                format: date
              - type: string
                format: date-time
        - name: toCreatedAt
          description: Filter by created date (Less than or equal)
          in: query
          examples:
            ShortDate:
              value: "2025-01-01"
              summary: Short date string format
            DateTime:
              value: "2025-01-01T00:00:00+01:00"
              summary: Date string format
          schema:
            oneOf:
              - type: string
                format: date
              - type: string
                format: date-time
        - name: page
          description: Set page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          description: Limit rows per page
          in: query
          schema:
            type: integer
            minimum: 5
            maximum: 100
            default: 10
        - name: sort
          description: Sort list by fields
          in: query
          examples:
            SortDesc:
              value: "-createdAt"
              summary: Sort desc
            Multiple:
              value: "-createdAt,+name"
              summary: Multiple
          schema:
            type: string
      responses:
        '200':
          description: 'List of Authors'
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Author'
                  pagination:
                    $ref: '#/components/schemas/PaginationView'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/JWTNotFound'
        '404':
          $ref: '#/components/responses/ObjectNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    post:
      summary: Create Author
      description: 'Create a new author with the provided details.'
      tags: [ Authors ]
      operationId: v1CreateAuthor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorPayload'
      responses:
        '201':
          description: 'Author created successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Author'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/JWTNotFound'
        '404':
          $ref: '#/components/responses/ObjectNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /authors/{authorId}:
    get:
      summary: Get Author
      description: 'Retrieve details of a specific author by their ID.'
      tags: [ Authors ]
      operationId: v1GetAuthor
      parameters:
        - name: authorId
          description: Author ID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'Author details'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Author'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/JWTNotFound'
        '404':
          $ref: '#/components/responses/ObjectNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    put:
      summary: Update Author
      description: 'Update the details of an existing author by their ID.'
      tags: [ Authors ]
      operationId: v1UpdateAuthor
      parameters:
        - name: authorId
          description: Author ID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorPayload'
      responses:
        '204':
          description: 'Author updated successfully'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/JWTNotFound'
        '404':
          $ref: '#/components/responses/ObjectNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    delete:
      summary: Delete Author
      description: 'Delete an existing author by their ID.'
      tags: [ Authors ]
      operationId: v1DeleteAuthor
      parameters:
        - name: authorId
          description: Author ID
          in: path
          required: true
          schema:
              type: string
              format: uuid
      responses:
        '204':
          description: 'Author deleted successfully'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/JWTNotFound'
        '404':
          $ref: '#/components/responses/ObjectNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  schemas:
    Author:
      type: object
      properties:
        id:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
        name:
          type: string
          example: John Doe
        realName:
          type: string
          example: Jonathan Doe
        genres:
          type: string
          example: "Terror, fantasía, ciencia ficción"
        biography:
          type: string
          example: "Born in 1970, John Doe is a renowned author known for his thrilling novels..."
        nationality:
          type: string
          example: American
        birthDate:
          type: string
          format: date
          example: 1970-01-01
        deathDate:
          type: string
          format: date
          example: 2020-12-31
        photoUrl:
          type: string
          example: https://example.com/photos/john_doe.jpg
        website:
          type: string
          example: https://johndoe.com
        createdBy:
          type: string
          example: admin
        createdAt:
          type: string
          format: date-time
          example: 2023-06-01T12:00:00Z
        updatedBy:
          type: string
          example: admin
        updatedAt:
          type: string
          format: date-time
          example: 2023-06-01T12:00:00Z

    AuthorPayload:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: John Doe
        realName:
          type: string
          example: Jonathan Doe
        genres:
          type: string
          example: "Terror, fantasía, ciencia ficción"
        biography:
          type: string
          example: "Born in 1970, John Doe is a renowned author known for his thrilling novels..."
        nationality:
          type: string
          example: American
        birthDate:
          type: string
          format: date
          example: 1970-01-01
        deathDate:
          type: string
          format: date
          example: 2020-12-31
        photoUrl:
          type: string
          example: https://example.com/photos/john_doe.jpg
        website:
          type: string
          example: https://johndoe.com

    PaginationView:
      type: object
      properties:
        total:
          type: integer
          example: 2
        rowsPerPage:
          type: integer
          example: 10
        page:
          type: integer
          example: 1
        totalPages:
          type: integer
          example: 5

  responses:
    Success:
      description: Success
      content:
        application/json:
          schema:
            properties:
              data:
                type: array
                items:
                  type: string
                example: []

    JWTNotFound:
      description: JWT not Found
      content:
        application/json:
          schema:
            properties:
              message:
                type: string
                example: JWT not Found
              code:
                type: integer
                example: 401

    ObjectNotFound:
      description: Object not Found
      content:
        application/json:
          schema:
            properties:
              message:
                type: string
                example: Object not found
              code:
                type: integer
                example: 404

    BadRequestError:
      description: Bad Request Error
      content:
        application/json:
          schema:
            properties:
              message:
                type: string
                example: Bad Request Error
              code:
                type: integer
                example: 400

    ServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            properties:
              message:
                type: string
                example: Internal Server Error
              code:
                type: integer
                example: 500

    ServiceUnavailable:
      description: Server Unavailable
      content:
        application/json:
          schema:
            properties:
              message:
                type: string
                example: Server Unavailable
              code:
                type: integer
                example: 503
