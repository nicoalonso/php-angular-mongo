# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(MONGODB_URL): ''
    env(MONGODB_DB): ''

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/**/DependencyInjection/'
            - '../src/**/Entity/'
            - '../src/**/Migrations/'
            - '../src/**/Tests/'
            - '../src/**/Domain/**/!(*Repository).php'
            - '../src/**/Application/**/*Payload.php'
            - '../src/**/Application/**/*Event.php'
            - '../src/**/Presentation/'
            - '../src/**/*Exception.php'
            - '../src/Kernel.php'

    App\Infrastructure\Controller\:
        resource: '../src/Infrastructure/Controller'
        tags: [ 'controller.service_arguments' ]

    Symfony\Component\HttpFoundation\Session\Storage\Handler\MongoDbSessionHandler:
        arguments:
            - '@doctrine_mongodb.odm.default_connection'
            - { database: '%env(MONGODB_DB)%', collection: 'sessions' }

    App\Infrastructure\EventListener\RequestJsonListener:
        tags:
            - { name: kernel.event_listener, event: kernel.request }

    App\Infrastructure\EventListener\ExceptionListener:
        tags:
            - { name: kernel.event_listener, event: kernel.exception }

    # messenger
    domain_handlers:
        namespace: App\Application\
        resource: '%kernel.project_dir%/src/Application/**/*DomainHandler.php'
        autoconfigure: false
        tags:
            - { name: messenger.message_handler, bus: domain.bus }

    # Swagger Documentation by areas
    swagger_v1:
        class: App\Infrastructure\Swagger\SwaggerDoc
        arguments:
            - v1
        tags:
            - { name: "nelmio_api_doc.describer.v1" }
